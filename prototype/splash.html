<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智惠本草 - 开屏页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/tdesign-mobile-vue@latest/dist/tdesign.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .herb-gradient {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 50%, #81c784 100%);
        }
        
        .blue-gradient {
            background: linear-gradient(135deg, #1976d2 0%, #42a5f5 50%, #90caf9 100%);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(1.05);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .pulse {
            animation: pulse 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body class="bg-gray-900">
    <div class="w-full h-screen flex flex-col relative overflow-hidden">
        <!-- 背景图片 -->
        <div class="absolute inset-0">
            <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=chinese%20traditional%20medicine%20herbs%20ginseng%20artistic%20elegant%20green%20and%20blue%20aesthetic&image_size=portrait_4_3" alt="中医药文化" class="w-full h-full object-cover fade-in">
            <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
        </div>
        
        <!-- 右上角关闭按钮 -->
        <div class="relative z-20 flex justify-end pt-12 pr-4">
            <button class="w-10 h-10 bg-black/50 backdrop-blur-sm rounded-full flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        
        <!-- 倒计时提示 -->
        <div class="relative z-20 flex justify-end pr-4 mt-2">
            <div class="bg-black/50 backdrop-blur-sm rounded-full px-3 py-1 flex items-center">
                <span class="text-white text-sm">
                    <span class="font-bold text-green-400">5</span>s 后自动跳过
                </span>
            </div>
        </div>
        
        <!-- 主要内容 -->
        <div class="relative z-10 flex-1 flex flex-col justify-end px-6 pb-10">
            <!-- 广告标签 -->
            <div class="mb-3">
                <span class="bg-white/20 backdrop-blur-sm text-white px-3 py-1 rounded-full text-xs font-medium">
                    中医药文化
                </span>
            </div>
            
            <!-- 标题 -->
            <h1 class="text-3xl font-bold text-white mb-3 leading-tight">
                传承千年智慧<br/>
                探索本草奥秘
            </h1>
            
            <!-- 描述 -->
            <p class="text-gray-200 text-sm mb-6 leading-relaxed">
                从《神农本草经》到《本草纲目》，数千年的智慧结晶，让我们一起探索中医药的神奇世界。
            </p>
            
            <!-- 按钮 -->
            <button class="herb-gradient text-white font-bold py-4 px-8 rounded-2xl text-lg shadow-lg w-full pulse">
                立即探索
            </button>
            
            <!-- 底部标识 -->
            <div class="mt-6 text-center">
                <div class="inline-flex items-center">
                    <div class="w-8 h-8 herb-gradient rounded-lg flex items-center justify-center mr-2">
                        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M17 8c.7 0 1.38.1 2.02.29L12 2.45 6.98 8.29C7.62 8.1 8.3 8 9 8c2.12 0 4.07.74 5.63 2l-1.42 1.42c-.29.29-.29.77 0 1.06.29.29.77.29 1.06 0L17 10.06l1.73 1.73c.29.29.77.29 1.06 0 .29-.29.29-.77 0-1.06L18.06 9c.31-.64.5-1.34.5-2.06C18.56 4.01 15.54 1 12 1S5.44 4.01 5.44 6.94C5.44 7.66 5.63 8.36 5.94 9l-2.29 2.29c-.29.29-.29.77 0 1.06.29.29.77.29 1.06 0L7 10.06l1.73 1.73c.29.29.77.29 1.06 0 .29-.29.29-.77 0-1.06L8.37 10C9.93 8.74 11.88 8 14 8z"/>
                        </svg>
                    </div>
                    <span class="text-white/80 text-sm">智惠本草</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
