<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智惠本草小程序原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/tdesign-mobile-vue@latest/dist/tdesign.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .phone-frame {
            width: 393px;
            height: 852px;
            border-radius: 55px;
            padding: 12px;
            background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
            box-shadow: 
                0 25px 50px rgba(0,0,0,0.3),
                inset 0 0 0 2px #333;
            position: relative;
        }
        
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 45px;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        
        .phone-notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 37px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 100;
        }
        
        .phone-notch::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 10px;
            width: 40px;
            height: 20px;
            background: #1a1a1a;
            border-radius: 10px;
        }
        
        .phone-notch::after {
            content: '';
            position: absolute;
            right: 35px;
            top: 12px;
            width: 10px;
            height: 10px;
            background: #1a1a1a;
            border-radius: 50%;
        }
        
        .phone-side-button {
            position: absolute;
            background: linear-gradient(145deg, #333, #222);
            border-radius: 2px;
        }
        
        .phone-button-power {
            right: -8px;
            top: 180px;
            width: 4px;
            height: 60px;
        }
        
        .phone-button-volume-up {
            left: -8px;
            top: 160px;
            width: 4px;
            height: 35px;
        }
        
        .phone-button-volume-down {
            left: -8px;
            top: 205px;
            width: 4px;
            height: 35px;
        }
        
        .herb-gradient {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 50%, #81c784 100%);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-12">
    <div class="container mx-auto px-4">
        <!-- 头部 -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center mb-4">
                <div class="w-16 h-16 herb-gradient rounded-2xl flex items-center justify-center mr-4 shadow-lg">
                    <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M17 8c.7 0 1.38.1 2.02.29L12 2.45 6.98 8.29C7.62 8.1 8.3 8 9 8c2.12 0 4.07.74 5.63 2l-1.42 1.42c-.29.29-.29.77 0 1.06.29.29.77.29 1.06 0L17 10.06l1.73 1.73c.29.29.77.29 1.06 0 .29-.29.29-.77 0-1.06L18.06 9c.31-.64.5-1.34.5-2.06C18.56 4.01 15.54 1 12 1S5.44 4.01 5.44 6.94C5.44 7.66 5.63 8.36 5.94 9l-2.29 2.29c-.29.29-.29.77 0 1.06.29.29.77.29 1.06 0L7 10.06l1.73 1.73c.29.29.77.29 1.06 0 .29-.29.29-.77 0-1.06L8.37 10C9.93 8.74 11.88 8 14 8z"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-800">智惠本草</h1>
            </div>
            <p class="text-gray-600 text-lg">小程序原型展示</p>
            <p class="text-gray-400 text-sm mt-1">iPhone 15 Pro 尺寸模拟 · TDesign 设计风格</p>
        </div>
        
        <!-- 页面展示网格 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-8 justify-items-center">
            <!-- 开屏页 -->
            <div class="flex flex-col items-center">
                <h2 class="text-lg font-bold text-gray-700 mb-4">开屏页</h2>
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <div class="phone-side-button phone-button-power"></div>
                    <div class="phone-side-button phone-button-volume-up"></div>
                    <div class="phone-side-button phone-button-volume-down"></div>
                    <div class="phone-screen">
                        <iframe src="splash.html" class="w-full h-full border-0"></iframe>
                    </div>
                </div>
                <p class="text-gray-500 text-sm mt-4 text-center max-w-xs">
                    5秒倒计时广告页，右上角可点击关闭
                </p>
            </div>
            
            <!-- 首页 -->
            <div class="flex flex-col items-center">
                <h2 class="text-lg font-bold text-gray-700 mb-4">首页 · 扫码取纸</h2>
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <div class="phone-side-button phone-button-power"></div>
                    <div class="phone-side-button phone-button-volume-up"></div>
                    <div class="phone-side-button phone-button-volume-down"></div>
                    <div class="phone-screen">
                        <iframe src="home.html" class="w-full h-full border-0"></iframe>
                    </div>
                </div>
                <p class="text-gray-500 text-sm mt-4 text-center max-w-xs">
                    应急场景下的快速取纸入口，扫码即可领取免费纸巾
                </p>
            </div>
            
            <!-- 趣味答题页 -->
            <div class="flex flex-col items-center">
                <h2 class="text-lg font-bold text-gray-700 mb-4">趣味答题</h2>
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <div class="phone-side-button phone-button-power"></div>
                    <div class="phone-side-button phone-button-volume-up"></div>
                    <div class="phone-side-button phone-button-volume-down"></div>
                    <div class="phone-screen">
                        <iframe src="quiz.html" class="w-full h-full border-0"></iframe>
                    </div>
                </div>
                <p class="text-gray-500 text-sm mt-4 text-center max-w-xs">
                    游戏化知识问答，答对获得优惠券
                </p>
            </div>
            
            <!-- AR本草识图页 -->
            <div class="flex flex-col items-center">
                <h2 class="text-lg font-bold text-gray-700 mb-4">AR本草识图</h2>
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <div class="phone-side-button phone-button-power"></div>
                    <div class="phone-side-button phone-button-volume-up"></div>
                    <div class="phone-side-button phone-button-volume-down"></div>
                    <div class="phone-screen">
                        <iframe src="ar.html" class="w-full h-full border-0"></iframe>
                    </div>
                </div>
                <p class="text-gray-500 text-sm mt-4 text-center max-w-xs">
                    扫描纸巾图案，展示3D药材模型
                </p>
            </div>
            
            <!-- 个人中心页 -->
            <div class="flex flex-col items-center">
                <h2 class="text-lg font-bold text-gray-700 mb-4">个人中心</h2>
                <div class="phone-frame">
                    <div class="phone-notch"></div>
                    <div class="phone-side-button phone-button-power"></div>
                    <div class="phone-side-button phone-button-volume-up"></div>
                    <div class="phone-side-button phone-button-volume-down"></div>
                    <div class="phone-screen">
                        <iframe src="profile.html" class="w-full h-full border-0"></iframe>
                    </div>
                </div>
                <p class="text-gray-500 text-sm mt-4 text-center max-w-xs">
                    个人数据统计与优惠券管理
                </p>
            </div>
        </div>
        
        <!-- 技术说明 -->
        <div class="mt-16 text-center text-gray-500 text-sm">
            <p class="mb-2">技术栈：HTML5 + Tailwind CSS + TDesign</p>
            <p>设计风格：现代医工交叉风（草本绿 + 数智蓝）</p>
        </div>
    </div>
</body>
</html>
