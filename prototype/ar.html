<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智惠本草 - AR识别</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/tdesign-mobile-vue@latest/dist/tdesign.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .herb-gradient {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 50%, #81c784 100%);
        }
        
        .blue-gradient {
            background: linear-gradient(135deg, #1976d2 0%, #42a5f5 50%, #90caf9 100%);
        }
        
        .scan-frame {
            animation: scan 2s ease-in-out infinite;
        }
        
        @keyframes scan {
            0%, 100% {
                transform: translateY(-10px);
            }
            50% {
                transform: translateY(10px);
            }
        }
        
        .pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        @keyframes pulse-ring {
            0% {
                transform: scale(0.33);
                opacity: 1;
            }
            80%, 100% {
                transform: scale(2);
                opacity: 0;
            }
        }
        
        .model-container {
            perspective: 1000px;
        }
        
        .rotate-hint {
            animation: rotate-hint 2s ease-in-out infinite;
        }
        
        @keyframes rotate-hint {
            0%, 100% {
                transform: rotate(-10deg);
            }
            50% {
                transform: rotate(10deg);
            }
        }
    </style>
</head>
<body class="bg-gray-900">
    <div class="w-full h-screen flex flex-col relative">
        <!-- 相机预览区域（模拟） -->
        <div class="absolute inset-0 bg-gradient-to-b from-gray-800 to-gray-900">
            <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=camera%20view%20blurred%20background%20herbal%20pattern&image_size=portrait_4_3" alt="相机预览" class="w-full h-full object-cover opacity-50">
        </div>
        
        <!-- 顶部状态栏 -->
        <div class="relative z-10 flex justify-between items-center py-3 px-4">
            <button class="w-10 h-10 bg-black/50 rounded-full flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
            </button>
            <div class="text-white font-medium text-lg">AR本草识图</div>
            <button class="w-10 h-10 bg-black/50 rounded-full flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/>
                </svg>
            </button>
        </div>
        
        <!-- 主要内容 - 识别状态1：扫描中 -->
        <div class="relative z-10 flex-1 flex flex-col items-center justify-center px-6">
            <!-- 扫描框 -->
            <div class="relative mb-8">
                <div class="absolute inset-0 herb-gradient rounded-2xl pulse-ring"></div>
                <div class="relative w-64 h-64 border-4 border-green-400 rounded-2xl flex items-center justify-center">
                    <div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-green-400 rounded-tl-xl"></div>
                    <div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-green-400 rounded-tr-xl"></div>
                    <div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-green-400 rounded-bl-xl"></div>
                    <div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-green-400 rounded-br-xl"></div>
                    
                    <!-- 扫描线 -->
                    <div class="scan-frame absolute inset-x-4 h-1 bg-gradient-to-r from-transparent via-green-400 to-transparent"></div>
                    
                    <div class="text-center">
                        <svg class="w-16 h-16 text-green-400 mx-auto mb-2" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                        <p class="text-white font-medium">扫描纸巾上的图案</p>
                    </div>
                </div>
            </div>
            
            <!-- 提示文字 -->
            <div class="bg-black/60 backdrop-blur rounded-xl px-6 py-4 text-center">
                <p class="text-white font-medium mb-1">将药材图案放入框内</p>
                <p class="text-gray-300 text-sm">系统将自动识别并展示3D模型</p>
            </div>
        </div>
        
        <!-- 识别成功状态（隐藏，用于演示） -->
        <div class="relative z-10 flex-1 flex-col items-center justify-center px-6 hidden">
            <!-- 3D模型展示区域 -->
            <div class="model-container relative mb-6">
                <div class="w-72 h-72 bg-gradient-to-br from-green-500/20 to-blue-500/20 rounded-3xl flex items-center justify-center backdrop-blur-sm border border-white/20">
                    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=3D%20ginseng%20root%20herbal%20medicine%20realistic%20rendering&image_size=square" alt="3D人参模型" class="w-48 h-48 object-contain rotate-hint">
                </div>
                <div class="absolute -bottom-3 left-1/2 transform -translate-x-1/2 bg-white rounded-full px-4 py-1 shadow-lg">
                    <span class="text-gray-600 text-sm">✋ 双指缩放 · 单指旋转</span>
                </div>
            </div>
            
            <!-- 药材信息卡片 -->
            <div class="bg-white/95 backdrop-blur rounded-2xl p-5 w-full max-w-sm shadow-xl">
                <div class="flex items-start">
                    <div class="w-16 h-16 herb-gradient rounded-xl flex items-center justify-center mr-4 flex-shrink-0">
                        <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 22c4.97 0 9-4.03 9-9-4.97 0-9 4.03-9 9zM5.6 10.25c0 1.38 1.12 2.5 2.5 2.5.53 0 1.01-.16 1.42-.44l-.02.19c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5l-.02-.19c.4.28.89.44 1.42.44 1.38 0 2.5-1.12 2.5-2.5 0-1-.59-1.85-1.43-2.25.84-.4 1.43-1.25 1.43-2.25 0-1.38-1.12-2.5-2.5-2.5-.53 0-1.01.16-1.42.44l.02-.19C14.5 3.62 13.38 2.5 12 2.5S9.5 3.62 9.5 5l.02.19c-.4-.28-.89-.44-1.42-.44-1.38 0-2.5 1.12-2.5 2.5 0 1 .59 1.85 1.43 2.25-.84.4-1.43 1.25-1.43 2.25z"/>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-gray-800 mb-1">人参</h3>
                        <p class="text-green-600 font-medium mb-2">Panax ginseng</p>
                        <p class="text-gray-600 text-sm leading-relaxed">
                            大补元气，复脉固脱，补脾益肺，生津，安神。用于体虚欲脱，肢冷脉微，脾虚食少，肺虚喘咳，津伤口渴，内热消渴，久病虚羸，惊悸失眠，阳痿宫冷。
                        </p>
                    </div>
                </div>
                
                <div class="mt-4 pt-4 border-t border-gray-100">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            <span class="text-gray-500 text-sm">性味</span>
                            <span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-medium">甘、微苦</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-gray-500 text-sm">归经</span>
                            <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-medium">脾、肺、心经</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 底部操作栏 -->
        <div class="relative z-10 pb-8 pt-4 px-6">
            <div class="flex justify-center space-x-6">
                <button class="flex flex-col items-center text-white/80">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur rounded-full flex items-center justify-center mb-1">
                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                        </svg>
                    </div>
                    <span class="text-xs">相册</span>
                </button>
                
                <button class="flex flex-col items-center text-white">
                    <div class="w-16 h-16 herb-gradient rounded-full flex items-center justify-center mb-1 shadow-lg">
                        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                    <span class="text-xs font-medium">识别</span>
                </button>
                
                <button class="flex flex-col items-center text-white/80">
                    <div class="w-14 h-14 bg-white/20 backdrop-blur rounded-full flex items-center justify-center mb-1">
                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                        </svg>
                    </div>
                    <span class="text-xs">历史</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
