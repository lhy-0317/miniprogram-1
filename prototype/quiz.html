<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智惠本草 - 趣味答题</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/tdesign-mobile-vue@latest/dist/tdesign.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .herb-gradient {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 50%, #81c784 100%);
        }
        
        .option-item {
            transition: all 0.3s ease;
        }
        
        .option-item:active {
            transform: scale(0.98);
        }
        
        .option-item.correct {
            background-color: #f0fdf4 !important;
            border-color: #22c55e !important;
        }
        
        .option-item.wrong {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
        }
        
        .modal-bg {
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            animation: slideUp 0.4s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .header-icon {
            width: 28px;
            height: 28px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="w-full h-screen flex flex-col">
        <!-- 顶部状态栏 -->
        <div class="herb-gradient text-white pt-10 pb-4 px-4 flex items-center">
            <div class="flex items-center space-x-2">
                <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=quiz%20icon%20minimal%20green&image_size=square" alt="quiz" class="header-icon">
                <span class="font-medium text-lg">趣味答题</span>
            </div>
        </div>
        
        <!-- 主要内容 -->
        <div class="flex-1 flex flex-col p-6 bg-gradient-to-b from-green-50 to-blue-50 overflow-y-auto">
            <!-- 连续答对统计 -->
            <div class="text-center mb-4">
                <span class="text-lg font-medium text-gray-700">您已答对 <span class="text-green-600 font-bold">0</span>/<span class="text-green-600 font-bold">5</span> 题</span>
            </div>
            
            <!-- 题目卡片 -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
                <div class="text-lg font-medium text-gray-500 mb-2">第一题</div>
                <h2 class="text-xl font-bold text-gray-800">四季养生的原则包括？</h2>
            </div>
            
            <!-- 选项 -->
            <div class="space-y-4 flex-1">
                <div class="option-item bg-white border-2 border-gray-200 rounded-xl p-4 cursor-pointer flex items-center">
                    <div class="w-6 h-6 border-2 border-gray-300 rounded-full mr-4 flex-shrink-0"></div>
                    <span class="text-gray-700 font-medium flex-1">春夏养阳</span>
                </div>
                
                <div class="option-item bg-white border-2 border-gray-200 rounded-xl p-4 cursor-pointer flex items-center">
                    <div class="w-6 h-6 border-2 border-gray-300 rounded-full mr-4 flex-shrink-0"></div>
                    <span class="text-gray-700 font-medium flex-1">秋冬消暑</span>
                </div>
                
                <div class="option-item bg-white border-2 border-gray-200 rounded-xl p-4 cursor-pointer flex items-center">
                    <div class="w-6 h-6 border-2 border-gray-300 rounded-full mr-4 flex-shrink-0"></div>
                    <span class="text-gray-700 font-medium flex-1">春夏养阴</span>
                </div>
                
                <div class="option-item bg-white border-2 border-gray-200 rounded-xl p-4 cursor-pointer flex items-center">
                    <div class="w-6 h-6 border-2 border-gray-300 rounded-full mr-4 flex-shrink-0"></div>
                    <span class="text-gray-700 font-medium flex-1">秋冬养阳</span>
                </div>
            </div>
            
            <!-- 答案解析（隐藏） -->
            <div class="bg-amber-50 rounded-xl p-4 mt-4 flex items-start hidden">
                <svg class="w-8 h-8 text-amber-500 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <span class="text-gray-700 text-sm">《黄帝内经》提出"春夏养阳，秋冬养阴"的四季养生原则。</span>
            </div>
            
            <!-- 下一题按钮（隐藏） -->
            <div class="mt-6">
                <button class="w-full herb-gradient text-white font-bold py-4 rounded-2xl text-lg hidden">
                    下一题
                </button>
            </div>
        </div>
        
        <!-- 优惠券弹窗（隐藏） -->
        <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden modal-bg">
            <div class="bg-white w-11/12 max-w-md rounded-2xl p-6 modal-content">
                <div class="text-center">
                    <div class="w-24 h-24 herb-gradient rounded-full mx-auto mb-4 flex items-center justify-center">
                        <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800 mb-2">恭喜答对！</h3>
                    <p class="text-gray-500 mb-6">已答对5题，获得一张免费领纸券</p>
                    
                    <div class="bg-gradient-to-r from-yellow-50 to-orange-50 rounded-2xl p-4 mb-6 border-2 border-dashed border-yellow-300 flex items-center">
                        <div class="flex-1">
                            <div class="text-3xl font-bold text-orange-600">免费</div>
                            <div class="text-gray-600">领纸券</div>
                        </div>
                        <div class="text-right">
                            <div class="text-gray-500 text-sm">有效期至</div>
                            <div class="text-gray-700 font-medium">2026-04-01</div>
                        </div>
                    </div>
                    
                    <button class="w-full herb-gradient text-white font-bold py-4 rounded-2xl text-lg">
                        开心收下
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
