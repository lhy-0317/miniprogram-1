<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智惠本草 - 首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/tdesign-mobile-vue@latest/dist/tdesign.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .herb-gradient {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 50%, #81c784 100%);
        }
        
        .scan-button {
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
            transition: all 0.3s ease;
        }
        
        .scan-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        
        .pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        @keyframes pulse-ring {
            0% {
                transform: scale(0.33);
                opacity: 1;
            }
            80%, 100% {
                transform: scale(2);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="w-full h-screen flex flex-col">
        <!-- 顶部状态栏 -->
        <div class="herb-gradient text-white pt-10 pb-4 px-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <span class="font-medium text-lg">智惠本草</span>
            </div>
            <div class="flex items-center space-x-3">
                <svg class="w-9 h-9" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                </svg>
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                    <span class="text-sm font-medium">用</span>
                </div>
            </div>
        </div>
        
        <!-- 主要内容 -->
        <div class="flex-1 flex flex-col items-center justify-center px-6 bg-gradient-to-b from-green-50 to-blue-50">
            <!-- Logo区域 -->
            <div class="text-center mb-10">
                <div class="w-24 h-24 herb-gradient rounded-3xl mx-auto mb-4 flex items-center justify-center shadow-lg overflow-hidden">
                    <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=chinese%20herbal%20medicine%20logo%20ginseng%20green%20elegant&image_size=square" alt="logo" class="w-full h-full object-cover">
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-2">智惠本草</h1>
                <p class="text-gray-500 text-sm">智慧环保 · 传承本草</p>
            </div>
            
            <!-- 扫码区域 -->
            <div class="relative mb-8">
                <div class="absolute inset-0 herb-gradient rounded-3xl pulse-ring"></div>
                <div class="relative w-64 h-64 bg-white rounded-3xl shadow-2xl flex items-center justify-center border-4 border-dashed border-green-300">
                    <div class="text-center">
                        <div class="w-16 h-16 herb-gradient rounded-2xl mx-auto mb-4 flex items-center justify-center">
                            <svg class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M9.5 6.5v3h-3v-3h3M11 5H5v6h6V5zm-1.5 9.5v3h-3v-3h3M11 13H5v6h6v-6zm6.5-6.5v3h-3v-3h3M19 5h-6v6h6V5zm-6 8h1.5v1.5H13V13zm1.5 1.5H16V16h-1.5v-1.5zM16 13h1.5v1.5H16V13zm-3 3h1.5v1.5H13V16zm1.5 1.5H16V19h-1.5v-1.5zM16 16h1.5v1.5H16V16zm1.5-1.5H19V16h-1.5v-1.5zm0 3H19V19h-1.5v-1.5z"/>
                            </svg>
                        </div>
                        <p class="text-gray-600 font-medium">扫描设备二维码</p>
                        <p class="text-gray-400 text-xs mt-1">领取免费纸巾</p>
                    </div>
                </div>
            </div>
            
            <!-- 领纸按钮 -->
            <button class="scan-button herb-gradient text-white font-bold py-4 px-12 rounded-2xl text-lg mb-6">
                点击扫码领纸
            </button>
            
            <!-- 状态提示 -->
            <div class="bg-white rounded-xl px-5 py-3 shadow-md flex items-center space-x-3">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-gray-700 text-sm font-medium">设备在线 · 纸张充足</span>
            </div>
        </div>
        
        <!-- 底部导航 -->
        <div class="bg-white border-t border-gray-200 px-4 py-2 flex justify-around items-center">
            <div class="flex flex-col items-center text-green-600">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                <span class="text-xs font-medium">首页</span>
            </div>
            <div class="flex flex-col items-center text-gray-400">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9 2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                <span class="text-xs">答题</span>
            </div>
            <div class="flex flex-col items-center text-gray-400">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <span class="text-xs">AR识别</span>
            </div>
            <div class="flex flex-col items-center text-gray-400">
                <svg class="w-6 h-6 mb-1" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <span class="text-xs">我的</span>
            </div>
        </div>
    </div>
</body>
</html>
