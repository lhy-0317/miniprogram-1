    <script>
    // 依赖 js/admin-api.js 提供的 window.AdminAPI（本页不再声明 API_BASE，
    // 否则会与其全局声明冲突导致整页脚本解析失败）
    const { get, escapeHtml, formatDate } = window.AdminAPI;

    function checkLogin() {
      if (!sessionStorage.getItem('adminToken')) {
        window.location.href = 'login.html';
        return;
      }
      const username = sessionStorage.getItem('adminUsername');
      if (username) {
        document.getElementById('adminName').textContent = username;
      }
    }

    function showCardError(id, msg) {
      const el = document.getElementById(id);
      if (el) el.innerHTML = `<p class="text-red-600 text-center py-4 text-sm">加载失败：${escapeHtml(msg)}</p>`;
    }

    async function loadStats() {
      try {
        const data = await get('/api/admin/dashboard/stats');
        if (!data || !data.success) throw new Error((data && data.message) || '服务端返回失败');
        document.getElementById('totalUsers').textContent = data.data.totalUsers || 0;
        document.getElementById('totalCoupons').textContent = data.data.totalCoupons || 0;
        document.getElementById('totalRecords').textContent = data.data.totalRecords || 0;
        document.getElementById('totalQuestions').textContent = data.data.totalQuestions || 0;
      } catch (err) {
        ['totalUsers', 'totalCoupons', 'totalRecords', 'totalQuestions'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.textContent = '-';
        });
        console.error('加载统计数据失败', err);
        alert('统计数据加载失败：' + (err && err.message ? err.message : err));
      }
    }

    async function loadRecentUsers() {
      try {
        const data = await get('/api/admin/users?pageSize=5');
        const container = document.getElementById('recentUsers');
        if (!data || !data.success) throw new Error((data && data.message) || '服务端返回失败');
        if (!data.data.list || data.data.list.length === 0) {
          container.innerHTML = '<p class="text-gray-500 text-center py-4">暂无用户</p>';
          return;
        }
        container.innerHTML = data.data.list.map(user => `
          <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center text-white font-bold">
                ${escapeHtml((user.nickName || '用')[0])}
              </div>
              <div>
                <p class="font-medium text-gray-800">${escapeHtml(user.nickName || '微信用户')}</p>
                <p class="text-xs text-gray-500">${formatDate(user.createTime)}</p>
              </div>
            </div>
            <div class="text-right">
              <p class="text-sm text-gray-600">答题 ${user.quizCount || 0} 道</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('加载最近用户失败', err);
        showCardError('recentUsers', err && err.message ? err.message : err);
      }
    }

    async function loadRecentCoupons() {
      try {
        const data = await get('/api/admin/coupons?pageSize=5');
        const container = document.getElementById('recentCoupons');
        if (!data || !data.success) throw new Error((data && data.message) || '服务端返回失败');
        if (!data.data.list || data.data.list.length === 0) {
          container.innerHTML = '<p class="text-gray-500 text-center py-4">暂无优惠券</p>';
          return;
        }
        container.innerHTML = data.data.list.map(coupon => `
          <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
            <div>
              <p class="font-medium text-gray-800">${escapeHtml(coupon.amount)} ${escapeHtml(coupon.type)}</p>
              <p class="text-xs text-gray-500">${formatDate(coupon.createTime)}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-medium ${
              coupon.status === 'unused' ? 'bg-green-100 text-green-700' :
              coupon.status === 'used' ? 'bg-blue-100 text-blue-700' :
              'bg-gray-100 text-gray-700'
            }">
              ${coupon.status === 'unused' ? '未使用' : coupon.status === 'used' ? '已使用' : '已过期'}
            </span>
          </div>
        `).join('');
      } catch (err) {
        console.error('加载最近优惠券失败', err);
        showCardError('recentCoupons', err && err.message ? err.message : err);
      }
    }

    checkLogin();
    loadStats();
    loadRecentUsers();
    loadRecentCoupons();
    </script>
