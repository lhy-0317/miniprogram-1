        <main class="flex-1 overflow-y-auto">
            <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">优惠券管理</h2>
                <button onclick="showAddModal()" class="px-4 py-2 bg-gradient-to-r from-green-600 to-green-500 text-white rounded-lg hover:from-green-700 hover:to-green-600 transition">
                    + 发放优惠券
                </button>
            </header>
            
            <div class="p-8">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white rounded-xl p-4 shadow-sm">
                        <p class="text-gray-500 text-sm">优惠券总数</p>
                        <p class="text-2xl font-bold text-gray-800 mt-1" id="statTotal">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm">
                        <p class="text-gray-500 text-sm">未使用</p>
                        <p class="text-2xl font-bold text-green-600 mt-1" id="statUnused">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm">
                        <p class="text-gray-500 text-sm">已使用</p>
                        <p class="text-2xl font-bold text-blue-600 mt-1" id="statUsed">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm">
                        <p class="text-gray-500 text-sm">已过期</p>
                        <p class="text-2xl font-bold text-gray-600 mt-1" id="statExpired">-</p>
                    </div>
                </div>
                
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">优惠券</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">用户</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">有效期</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">状态</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">发放时间</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">操作</th>
                            </tr>
                        </thead>
                        <tbody id="couponTableBody" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="6" class="px-6 py-8 text-center text-gray-500">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md">
            <h3 class="text-xl font-bold text-gray-800 mb-4">发放优惠券</h3>
            <form id="addForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">优惠券类型</label>
                    <select id="couponType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                        <option value="免费领纸券">免费领纸券</option>
                        <option value="买2送1优惠券">买2送1优惠券</option>
                        <option value="8折购物券">8折购物券</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">有效期（天）</label>
                    <input type="number" id="expireDays" value="30" min="1" max="365"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">发放给用户（填 OpenID 或其末 8 位；留空 = 发放给所有用户，上限 200 人）</label>
                    <input type="text" id="targetUser" placeholder="可选"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="closeAddModal()" class="flex-1 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 transition">取消</button>
                    <button type="submit" class="flex-1 py-2 bg-gradient-to-r from-green-600 to-green-500 text-white rounded-lg hover:from-green-700 hover:to-green-600 transition">发放</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
    // 依赖 js/admin-api.js（本页不声明 API_BASE，避免全局重复声明导致脚本解析失败）
    const { get, post, del, escapeHtml, formatDate, renderError } = window.AdminAPI;

    async function loadCoupons() {
      try {
        const data = await get('/api/admin/coupons?pageSize=100');
        if (!data || !data.success) throw new Error((data && data.message) || '服务端返回失败');
        const coupons = data.data.list || [];
        renderCoupons(coupons);
        updateStats(coupons, data.data.total || coupons.length);
      } catch (err) {
        renderError('couponTableBody', err, 6);
      }
    }

    function updateStats(coupons, total) {
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statUnused').textContent = coupons.filter(c => c.status === 'unused').length;
      document.getElementById('statUsed').textContent = coupons.filter(c => c.status === 'used').length;
      document.getElementById('statExpired').textContent = coupons.filter(c => c.status === 'expired').length;
    }

    function renderCoupons(coupons) {
      const tbody = document.getElementById('couponTableBody');
      if (!coupons || coupons.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">暂无优惠券</td></tr>';
        return;
      }
      tbody.innerHTML = coupons.map(coupon => `
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-4">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 ${getCouponBgClass(coupon.type)} rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5 ${getCouponTextClass(coupon.type)}" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42z"/>
                </svg>
              </div>
              <div>
                <p class="font-bold ${getCouponTextClass(coupon.type)}">${escapeHtml(coupon.amount)}</p>
                <p class="text-sm text-gray-500">${escapeHtml(coupon.type)}</p>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 text-sm text-gray-500 font-mono">${escapeHtml(String(coupon.openid || '').slice(-8) || '未绑定')}</td>
          <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(coupon.expireDate || '-')}</td>
          <td class="px-6 py-4"><span class="px-3 py-1 rounded-full text-xs font-medium ${getStatusClass(coupon.status)}">${getStatusText(coupon.status)}</span></td>
          <td class="px-6 py-4 text-sm text-gray-500">${formatDate(coupon.createTime)}</td>
          <td class="px-6 py-4">
            <button onclick="deleteCoupon('${coupon._id || coupon.id}')" class="text-red-600 hover:text-red-700 text-sm font-medium">删除</button>
          </td>
        </tr>
      `).join('');
    }

    function getCouponBgClass(t) {
      if (t === '领纸券') return 'bg-green-100';
      if (t === '购物券') return 'bg-purple-100';
      return 'bg-orange-100';
    }
    function getCouponTextClass(t) {
      if (t === '领纸券') return 'text-green-600';
      if (t === '购物券') return 'text-purple-600';
      return 'text-orange-600';
    }
    function getStatusClass(s) {
      if (s === 'unused') return 'bg-green-100 text-green-700';
      if (s === 'used') return 'bg-blue-100 text-blue-700';
      return 'bg-gray-100 text-gray-700';
    }
    function getStatusText(s) {
      if (s === 'unused') return '未使用';
      if (s === 'used') return '已使用';
      return '已过期';
    }

    function showAddModal() { document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addModal').classList.add('flex'); }
    function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addModal').classList.remove('flex'); }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('couponType').value;
      const expireDays = parseInt(document.getElementById('expireDays').value, 10) || 30;
      const targetUser = document.getElementById('targetUser').value.trim();

      let amount = '';
      if (type === '免费领纸券') amount = '免费';
      else if (type === '买2送1优惠券') amount = '买2送1';
      else amount = '8折';
      const typeMap = { '免费领纸券': '领纸券', '买2送1优惠券': '优惠券', '8折购物券': '购物券' };

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = '发放中...';

      try {
        // 留空 = 发放给所有用户（后端 all 模式）；否则按 OpenID 或其后 8 位定位单个用户
        const payload = { amount, type: typeMap[type] || '领纸券', expireDays };
        if (targetUser) payload.openid = targetUser; else payload.all = true;

        const res = await post('/api/admin/coupons', payload);
        if (!res) return;
        // 旧实现在此处不检查返回值，后端拒绝了也提示"发放成功"
        if (!res.success) { alert('发放失败：' + (res.message || '未知错误')); return; }

        closeAddModal();
        document.getElementById('addForm').reset();
        await loadCoupons();
        alert(res.message || '发放成功');
      } catch (err) {
        alert('发放失败：' + (err && err.message ? err.message : err));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '发放';
      }
    });

    async function deleteCoupon(couponId) {
      if (!confirm('确定要删除这张优惠券吗？')) return;
      try {
        const res = await del('/api/admin/coupons/' + couponId);
        if (!res) return;
        if (!res.success) { alert('删除失败：' + (res.message || '未知错误')); return; }
        await loadCoupons();
      } catch (err) {
        alert('删除失败：' + (err && err.message ? err.message : err));
      }
    }

    loadCoupons();
    </script>
</body>
