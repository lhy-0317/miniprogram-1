<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优惠券管理 - 智惠本草管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <style>
        .sidebar-item.active {
            background: linear-gradient(90deg, rgba(46, 125, 50, 0.2) 0%, transparent 100%);
            border-left: 3px solid #2e7d32;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <aside class="w-64 bg-white shadow-lg flex-shrink-0">
            <div class="p-6 border-b">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-green-600 to-green-400 rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="font-bold text-gray-800">智惠本草</h1>
                        <p class="text-xs text-gray-500">管理后台</p>
                    </div>
                </div>
            </div>
            
            <nav class="p-4 space-y-2">
                <a href="index.html" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                    </svg>
                    <span>仪表盘</span>
                </a>
                <a href="users.html" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                    </svg>
                    <span>用户管理</span>
                </a>
                <a href="coupons.html" class="sidebar-item active flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/>
                    </svg>
                    <span>优惠券管理</span>
                </a>
                <a href="quiz-records.html" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    <span>答题记录</span>
                </a>
                <a href="questions.html" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-700 hover:bg-gray-50 transition">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
                    </svg>
                    <span>题库管理</span>
                </a>
            </nav>
        </aside>
        
        <main class="flex-1 overflow-y-auto">
            <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">优惠券管理</h2>
                <button onclick="showAddModal()" class="px-4 py-2 bg-gradient-to-r from-green-600 to-green-500 text-white rounded-lg hover:from-green-700 hover:to-green-600 transition">
                    + 发放优惠券
                </button>
            </header>
            
            <div class="p-8">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white rounded-xl p-4 shadow-sm">
                        <p class="text-gray-500 text-sm">优惠券总数</p>
                        <p class="text-2xl font-bold text-gray-800 mt-1" id="statTotal">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm">
                        <p class="text-gray-500 text-sm">未使用</p>
                        <p class="text-2xl font-bold text-green-600 mt-1" id="statUnused">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm">
                        <p class="text-gray-500 text-sm">已使用</p>
                        <p class="text-2xl font-bold text-blue-600 mt-1" id="statUsed">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm">
                        <p class="text-gray-500 text-sm">已过期</p>
                        <p class="text-2xl font-bold text-gray-600 mt-1" id="statExpired">-</p>
                    </div>
                </div>
                
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">优惠券</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">用户</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">有效期</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">状态</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">发放时间</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">操作</th>
                            </tr>
                        </thead>
                        <tbody id="couponTableBody" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="6" class="px-6 py-8 text-center text-gray-500">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md">
            <h3 class="text-xl font-bold text-gray-800 mb-4">发放优惠券</h3>
            <form id="addForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">优惠券类型</label>
                    <select id="couponType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                        <option value="免费领纸券">免费领纸券</option>
                        <option value="买2送1优惠券">买2送1优惠券</option>
                        <option value="8折购物券">8折购物券</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">有效期（天）</label>
                    <input type="number" id="expireDays" value="30" min="1" max="365"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">发放给用户（OpenID后8位，留空则发放给所有用户）</label>
                    <input type="text" id="targetUser" placeholder="可选"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500">
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="closeAddModal()" class="flex-1 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 transition">取消</button>
                    <button type="submit" class="flex-1 py-2 bg-gradient-to-r from-green-600 to-green-500 text-white rounded-lg hover:from-green-700 hover:to-green-600 transition">发放</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const app = cloudbase.init({
            env: 'cloud1-6gqgdhv6f2059125'
        })
        
        const db = app.database()
        const auth = app.auth()
        
        async function initCloudBase() {
            try {
                const loginState = await auth.getLoginState()
                if (!loginState) {
                    await auth.signInAnonymously()
                    console.log('匿名登录成功')
                }
            } catch (err) {
                console.error('云开发初始化失败', err)
            }
        }
        
        function checkLogin() {
            if (!sessionStorage.getItem('adminLoggedIn')) {
                window.location.href = 'login.html'
            }
        }
        
        async function loadCoupons() {
            try {
                const result = await db.collection('coupons')
                    .orderBy('createTime', 'desc')
                    .limit(100)
                    .get()
                
                const coupons = result && result.data ? result.data : []
                renderCoupons(coupons)
                updateStats(coupons)
            } catch (err) {
                console.error('加载优惠券失败', err)
                document.getElementById('couponTableBody').innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">加载失败，请检查云开发配置</td></tr>'
            }
        }
        
        function updateStats(coupons) {
            if (!coupons) coupons = []
            const total = coupons.length
            const unused = coupons.filter(c => c.status === 'unused').length
            const used = coupons.filter(c => c.status === 'used').length
            const expired = coupons.filter(c => c.status === 'expired').length
            
            document.getElementById('statTotal').textContent = total
            document.getElementById('statUnused').textContent = unused
            document.getElementById('statUsed').textContent = used
            document.getElementById('statExpired').textContent = expired
        }
        
        function renderCoupons(coupons) {
            const tbody = document.getElementById('couponTableBody')
            
            if (!coupons || coupons.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">暂无优惠券</td></tr>'
                return
            }
            
            tbody.innerHTML = coupons.map(coupon => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 ${getCouponBgClass(coupon.type)} rounded-lg flex items-center justify-center">
                                <svg class="w-5 h-5 ${getCouponTextClass(coupon.type)}" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42z"/>
                                </svg>
                            </div>
                            <div>
                                <p class="font-bold ${getCouponTextClass(coupon.type)}">${coupon.amount}</p>
                                <p class="text-sm text-gray-500">${coupon.type}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500 font-mono">${(coupon._openid || '').slice(-8)}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${coupon.expireDate}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-full text-xs font-medium ${getStatusClass(coupon.status)}">
                            ${getStatusText(coupon.status)}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">${formatDate(coupon.createTime)}</td>
                    <td class="px-6 py-4">
                        <button onclick="deleteCoupon('${coupon._id}')" class="text-red-600 hover:text-red-700 text-sm font-medium">删除</button>
                    </td>
                </tr>
            `).join('')
        }
        
        function getCouponBgClass(type) {
            if (type === '领纸券') return 'bg-green-100'
            if (type === '购物券') return 'bg-purple-100'
            return 'bg-orange-100'
        }
        
        function getCouponTextClass(type) {
            if (type === '领纸券') return 'text-green-600'
            if (type === '购物券') return 'text-purple-600'
            return 'text-orange-600'
        }
        
        function getStatusClass(status) {
            if (status === 'unused') return 'bg-green-100 text-green-700'
            if (status === 'used') return 'bg-blue-100 text-blue-700'
            return 'bg-gray-100 text-gray-700'
        }
        
        function getStatusText(status) {
            if (status === 'unused') return '未使用'
            if (status === 'used') return '已使用'
            return '已过期'
        }
        
        function showAddModal() {
            document.getElementById('addModal').classList.remove('hidden')
            document.getElementById('addModal').classList.add('flex')
        }
        
        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden')
            document.getElementById('addModal').classList.remove('flex')
        }
        
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault()
            
            const type = document.getElementById('couponType').value
            const expireDays = parseInt(document.getElementById('expireDays').value)
            const targetUser = document.getElementById('targetUser').value.trim()
            
            let amount = ''
            if (type === '免费领纸券') amount = '免费'
            else if (type === '买2送1优惠券') amount = '买2送1'
            else amount = '8折'
            
            const expireDate = new Date()
            expireDate.setDate(expireDate.getDate() + expireDays)
            const formattedExpireDate = `${expireDate.getFullYear()}-${String(expireDate.getMonth() + 1).padStart(2, '0')}-${String(expireDate.getDate()).padStart(2, '0')}`
            
            try {
                if (targetUser) {
                    const userResult = await db.collection('users').where({
                        _openid: db.RegExp({
                            regexp: targetUser + '$',
                            options: 'i'
                        })
                    }).get()
                    
                    if (userResult.data.length > 0) {
                        await db.collection('coupons').add({
                            amount,
                            type,
                            expireDate: formattedExpireDate,
                            status: 'unused',
                            createTime: new Date(),
                            _openid: userResult.data[0]._openid
                        })
                    }
                } else {
                    const usersResult = await db.collection('users').limit(100).get()
                    for (const user of usersResult.data) {
                        await db.collection('coupons').add({
                            amount,
                            type,
                            expireDate: formattedExpireDate,
                            status: 'unused',
                            createTime: new Date(),
                            _openid: user._openid
                        })
                    }
                }
                
                closeAddModal()
                loadCoupons()
                alert('优惠券发放成功！')
            } catch (err) {
                console.error('发放优惠券失败', err)
                alert('发放失败：' + err.message)
            }
        })
        
        async function deleteCoupon(couponId) {
            if (!confirm('确定要删除这张优惠券吗？')) return
            
            try {
                await db.collection('coupons').doc(couponId).remove()
                loadCoupons()
            } catch (err) {
                console.error('删除失败', err)
                alert('删除失败')
            }
        }
        
        function formatDate(date) {
            if (!date) return '-'
            const d = new Date(date)
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
        }
        
        async function init() {
            checkLogin()
            await initCloudBase()
            await loadCoupons()
        }
        init()
    </script>
</body>
</html>
