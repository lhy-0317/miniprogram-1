            <div class="p-8">

                        <p class="text-2xl font-bold text-green-600 mt-1" id="statCorrect">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm">
                        <p class="text-gray-500 text-sm">错误数</p>
                        <p class="text-2xl font-bold text-red-600 mt-1" id="statWrong">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm">
                        <p class="text-gray-500 text-sm">正确率</p>
                        <p class="text-2xl font-bold text-blue-600 mt-1" id="statRate">-</p>
                    </div>
                </div>
                
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">题目</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">用户</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">答案</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">结果</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">答题时间</th>
                            </tr>
                        </thead>
                        <tbody id="recordTableBody" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="5" class="px-6 py-8 text-center text-gray-500">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="mt-6 flex justify-between items-center">
                    <p class="text-sm text-gray-500">共 <span id="totalCount">0</span> 条记录</p>
                    <div class="flex space-x-2">
                        <button onclick="prevPage()" id="prevBtn" class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50">上一页</button>
                        <button onclick="nextPage()" id="nextBtn" class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50">下一页</button>

    <script>
    // 依赖 js/admin-api.js（本页不声明 API_BASE，避免全局重复声明导致脚本解析失败）
    const { get, escapeHtml, formatDateTime, renderError } = window.AdminAPI;

    let currentPage = 1;
    const pageSize = 20;
    let totalRecords = 0;

    async function loadRecords() {
      try {
        const data = await get(`/api/admin/quiz-records?page=${currentPage}&pageSize=${pageSize}`);
        if (!data || !data.success) throw new Error((data && data.message) || '服务端返回失败');
        const records = data.data.list || [];
        totalRecords = data.data.total || 0;
        document.getElementById('totalCount').textContent = totalRecords;
        renderRecords(records);
        updatePagination();
      } catch (err) {
        renderError('recordTableBody', err, 5);
      }
    }

    /** 顶部统计卡改为全局口径（原先只统计当前页 20 条，翻页数字就变） */
    async function loadStats() {
      try {
        const data = await get('/api/admin/quiz-records/stats');
        if (!data || !data.success) throw new Error((data && data.message) || '服务端返回失败');
        document.getElementById('statTotal').textContent = data.data.total || 0;
        document.getElementById('statCorrect').textContent = data.data.correct || 0;
        document.getElementById('statWrong').textContent = data.data.wrong || 0;
        document.getElementById('statRate').textContent = data.data.rate === null ? '-' : data.data.rate + '%';
      } catch (err) {
        ['statTotal', 'statCorrect', 'statWrong', 'statRate'].forEach(id => {
          document.getElementById(id).textContent = '-';
        });
      }
    }

    function renderRecords(records) {
      const tbody = document.getElementById('recordTableBody');
      if (!records || records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">暂无答题记录</td></tr>';
        return;
      }
      const options = ['A', 'B', 'C', 'D'];
      const toLetters = v => Array.isArray(v) && v.length
        ? v.map(i => options[i] || '?').join('、')
        : (v !== undefined && v !== null ? (options[v] || '-') : '-');

      tbody.innerHTML = records.map(record => {
        const userAnswer = toLetters(record.userOptionIndices ?? record.userOptionIndex);
        const correctAnswer = toLetters(record.correctOptionIndices ?? record.correctOptionIndex);
        return `
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4"><p class="text-sm text-gray-800 font-medium">${escapeHtml(record.question || '未知题目')}</p></td>
            <td class="px-6 py-4 text-sm text-gray-500 font-mono">${escapeHtml(String(record.openid || '').slice(-8) || '-')}</td>
            <td class="px-6 py-4">
              <div class="text-sm">
                <span class="${record.isCorrect ? 'text-green-600' : 'text-red-600 line-through'}">${escapeHtml(userAnswer)}</span>
                ${!record.isCorrect ? '<span class="text-green-600 ml-2">正确: ' + escapeHtml(correctAnswer) + '</span>' : ''}
              </div>
            </td>
            <td class="px-6 py-4"><span class="px-3 py-1 rounded-full text-xs font-medium ${record.isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${record.isCorrect ? '正确' : '错误'}</span></td>
            <td class="px-6 py-4 text-sm text-gray-500">${formatDateTime(record.createTime)}</td>
          </tr>
        `;
      }).join('');
    }

    function prevPage() { if (currentPage > 1) { currentPage--; loadRecords(); } }
    function nextPage() { if (currentPage * pageSize < totalRecords) { currentPage++; loadRecords(); } }
    function updatePagination() {
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage * pageSize >= totalRecords;
    }

    loadStats();
    loadRecords();
    </script>
