        <main class="flex-1 overflow-y-auto">
            <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">用户管理</h2>
                <div class="flex items-center space-x-4">
                    <input type="text" id="searchInput" placeholder="搜索用户..."
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                </div>
            </header>
            
            <div class="p-8">
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">用户</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">OpenID</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">答题数</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">节约纸张</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">注册时间</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-gray-500">操作</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="6" class="px-6 py-8 text-center text-gray-500">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="mt-6 flex justify-between items-center">
                    <p class="text-sm text-gray-500">共 <span id="totalCount">0</span> 条记录</p>
                    <div class="flex space-x-2">
                        <button onclick="prevPage()" id="prevBtn" class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50">上一页</button>
                        <button onclick="nextPage()" id="nextBtn" class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50">下一页</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="userModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md">
            <h3 class="text-xl font-bold text-gray-800 mb-4">用户详情</h3>
            <div id="userDetail" class="space-y-4"></div>
            <button onclick="closeModal()" class="mt-6 w-full py-2 bg-gray-100 rounded-lg hover:bg-gray-200 transition">关闭</button>
        </div>
    </div>
    
    <script>
    // 依赖 js/admin-api.js（本页不声明 API_BASE，避免全局重复声明导致脚本解析失败）
    const { get, escapeHtml, formatDate, formatDateTime, renderError } = window.AdminAPI;

    let currentPage = 1;
    const pageSize = 10;
    let totalUsers = 0;
    let searchKeyword = '';
    let searchTimer = null;

    async function loadUsers() {
      try {
        const q = `/api/admin/users?page=${currentPage}&pageSize=${pageSize}`
          + (searchKeyword ? `&search=${encodeURIComponent(searchKeyword)}` : '');
        const data = await get(q);
        if (!data || !data.success) throw new Error((data && data.message) || '服务端返回失败');

        // 统一字段名 list（后端同时返回 users 兼容别名）
        const users = data.data.list || [];
        totalUsers = data.data.total || 0;
        document.getElementById('totalCount').textContent = totalUsers;
        renderUsers(users);
        updatePagination();
      } catch (err) {
        renderError('userTableBody', err, 6);
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('userTableBody');
      if (!users || users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">暂无用户</td></tr>';
        return;
      }
      tbody.innerHTML = users.map(user => `
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-4">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center text-white font-bold">
                ${escapeHtml((user.nickName || '用')[0])}
              </div>
              <div><p class="font-medium text-gray-800">${escapeHtml(user.nickName || '微信用户')}</p></div>
            </div>
          </td>
          <td class="px-6 py-4 text-sm text-gray-500 font-mono">${escapeHtml(String(user.openid || '').slice(-8) || '-')}</td>
          <td class="px-6 py-4 text-sm text-gray-600">${user.quizCount || 0} 道</td>
          <td class="px-6 py-4 text-sm text-gray-600">${user.savedPaper || 0} 张</td>
          <td class="px-6 py-4 text-sm text-gray-500">${formatDate(user.createTime)}</td>
          <td class="px-6 py-4">
            <button onclick="viewUser('${user._id}')" class="text-green-600 hover:text-green-700 text-sm font-medium">查看</button>
          </td>
        </tr>
      `).join('');
    }

    async function viewUser(userId) {
      const modal = document.getElementById('userModal');
      const detail = document.getElementById('userDetail');
      try {
        const data = await get('/api/admin/users/' + userId);
        if (!data || !data.success) { alert((data && data.message) || '获取用户详情失败'); return; }

        // 后端返回形状为 { user: {...}, coupons: [], records: [] }
        const user = data.data.user || {};
        detail.innerHTML = `
          <div class="flex items-center space-x-4 mb-4">
            <div class="w-16 h-16 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center text-white text-2xl font-bold">
              ${escapeHtml((user.nickName || '用')[0])}
            </div>
            <div>
              <p class="font-bold text-lg text-gray-800">${escapeHtml(user.nickName || '微信用户')}</p>
              <p class="text-sm text-gray-500">ID: ${escapeHtml(user._id || userId)}</p>
            </div>
          </div>
          <div class="space-y-3">
            <div class="flex justify-between"><span class="text-gray-500">OpenID:</span><span class="text-gray-800 font-mono text-sm">${escapeHtml(user.openid || '-')}</span></div>
            <div class="flex justify-between"><span class="text-gray-500">答题数:</span><span class="text-gray-800">${user.quizCount || 0} 道</span></div>
            <div class="flex justify-between"><span class="text-gray-500">节约纸张:</span><span class="text-gray-800">${user.savedPaper || 0} 张</span></div>
            <div class="flex justify-between"><span class="text-gray-500">注册时间:</span><span class="text-gray-800">${formatDateTime(user.createTime)}</span></div>
            <div class="flex justify-between"><span class="text-gray-500">优惠券:</span><span class="text-gray-800">${(data.data.coupons || []).length} 张</span></div>
            <div class="flex justify-between"><span class="text-gray-500">答题记录:</span><span class="text-gray-800">${(data.data.records || []).length} 条</span></div>
          </div>
        `;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } catch (err) {
        alert('获取用户详情失败：' + (err && err.message ? err.message : err));
      }
    }

    function closeModal() { document.getElementById('userModal').classList.add('hidden'); document.getElementById('userModal').classList.remove('flex'); }

    function prevPage() { if (currentPage > 1) { currentPage--; loadUsers(); } }
    function nextPage() { if (currentPage * pageSize < totalUsers) { currentPage++; loadUsers(); } }
    function updatePagination() {
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage * pageSize >= totalUsers;
    }

    // 搜索改为服务端查询（原实现只过滤当前页 10 条，后续页的用户搜不到）
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      const value = e.target.value.trim();
      searchTimer = setTimeout(() => {
        searchKeyword = value;
        currentPage = 1;
        loadUsers();
      }, 300);
    });

    loadUsers();
    </script>
</body>
