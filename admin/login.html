<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智惠本草 - 管理后台登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 50%, #81c784 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-br from-green-600 to-green-400 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg">
                <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">智惠本草</h1>
            <p class="text-gray-500 mt-2">管理后台</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                <input type="text" id="username" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
                    placeholder="请输入用户名">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent transition"
                    placeholder="请输入密码">
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-green-600 to-green-500 text-white py-3 rounded-xl font-medium hover:from-green-700 hover:to-green-600 transition shadow-lg">
                登录
            </button>
        </form>

        <div id="errorMsg" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm text-center"></div>

        <div class="mt-6 p-4 bg-blue-50 rounded-xl">
            <p class="text-sm text-blue-800">
                <span class="font-medium">提示：</span>账号由管理员统一分配，如遗失请联系系统管理员重置。
            </p>
        </div>
    </div>

    <script>
    const API_BASE = 'https://cloud1-d4g66lt423bd8978a-1407294908.ap-shanghai.app.tcloudbase.com/admin';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const res = await fetch(API_BASE + '/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => null);

        if (res.ok && data && data.success) {
          sessionStorage.setItem('adminToken', data.data.token);
          sessionStorage.setItem('adminUsername', data.data.username);
          window.location.href = 'index.html';
        } else if (res.status === 401) {
          errorMsg.textContent = (data && data.message) || '用户名或密码错误';
          errorMsg.classList.remove('hidden');
        } else if (res.status === 429) {
          errorMsg.textContent = '失败次数过多，请 15 分钟后再试';
          errorMsg.classList.remove('hidden');
        } else if (res.status === 503) {
          errorMsg.textContent = '服务未初始化：请先在云函数 adminService 的环境变量中配置 ADMIN_PASSWORD';
          errorMsg.classList.remove('hidden');
        } else {
          errorMsg.textContent = (data && data.message) || '登录失败，请稍后重试';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请检查接口地址是否正确';
        errorMsg.classList.remove('hidden');
      }
    });
    </script>
</body>
</html>
