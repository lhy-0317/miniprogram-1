    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .sidebar-item.active { background: linear-gradient(90deg, rgba(46,125,50,.2) 0%, transparent 100%); border-left: 3px solid #2e7d32; }
        .stat-card { cursor: pointer; transition: box-shadow .2s, transform .2s; }
        .stat-card:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
        .badge-on { background: #dcfce7; color: #166534; }
        .badge-off { background: #f1f5f9; color: #64748b; }
        .badge-out { background: #fee2e2; color: #b91c1c; }
        .badge-low { background: #fef3c7; color: #b45309; }
        #toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 90; transition: opacity .25s; }
        .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #f3f4f6; }
    </style>
</head>

        <main class="flex-1 overflow-y-auto">
            <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">商品管理</h2>
                <div class="text-sm text-gray-500">
                    当前登录：<span id="adminName" class="text-gray-700 font-medium">admin</span>
                    <button onclick="AdminAPI.logout()" class="ml-4 text-red-600 hover:text-red-700">退出</button>
                </div>
            </header>

            <div class="p-8 space-y-4">
                <div class="grid grid-cols-4 gap-4">
                    <div class="bg-white rounded-xl p-4 shadow-sm stat-card" onclick="filterByStatus('')">
                        <p class="text-gray-500 text-sm">全部商品</p>
                        <p class="text-2xl font-bold text-gray-800 mt-1" id="statAll">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm stat-card" onclick="filterByStatus('on')">
                        <p class="text-gray-500 text-sm">在售</p>
                        <p class="text-2xl font-bold text-green-600 mt-1" id="statOn">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm stat-card" onclick="filterByStatus('off')">
                        <p class="text-gray-500 text-sm">已下架</p>
                        <p class="text-2xl font-bold text-gray-500 mt-1" id="statOff">-</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 shadow-sm stat-card">
                        <p class="text-gray-500 text-sm">库存告警（本页 ≤10）</p>
                        <p class="text-2xl font-bold text-amber-600 mt-1" id="statLow">-</p>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm p-4 flex flex-wrap items-end gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">关键字</label>
                        <input id="filterKeyword" type="text" placeholder="商品名称 / 描述"
                            class="w-52 px-3 py-2 border border-gray-300 rounded-lg text-sm"
                            onkeydown="if (event.key === 'Enter') { event.preventDefault(); applyFilter(); }">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">分类</label>
                        <select id="filterCategory" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            <option value="">全部分类</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">状态</label>
                        <select id="filterStatus" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            <option value="">全部状态</option>
                            <option value="on">上架中</option>
                            <option value="off">已下架</option>
                        </select>
                    </div>
                    <button onclick="applyFilter()" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 transition">查询</button>
                    <button onclick="resetFilter()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200 transition">重置</button>

                    <div class="ml-auto flex items-center gap-2">
                        <button id="btnSeed" onclick="seedProducts()"
                            class="hidden px-4 py-2 bg-amber-50 border border-amber-200 text-amber-700 rounded-lg text-sm hover:bg-amber-100 transition">导入默认商品</button>
                        <button onclick="openForm()"
                            class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700 transition">+ 新增商品</button>
                    </div>
                </div>

                <div id="batchBar" class="hidden bg-white rounded-xl shadow-sm px-4 py-3 flex items-center justify-between">
                    <span class="text-sm text-gray-600">已选 <span id="selectedCount" class="font-bold text-green-700">0</span> 项</span>
                    <div class="flex gap-2">
                        <button onclick="clearSelection()" class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg text-sm hover:bg-gray-200">取消选择</button>
                        <button onclick="batchDelete()" class="px-3 py-1.5 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm hover:bg-red-100">批量删除</button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="pl-6 pr-2 py-4 w-10">
                                        <input type="checkbox" id="checkAll" onchange="toggleAll(this.checked)" class="w-4 h-4">
                                    </th>
                                    <th class="px-4 py-4 text-left text-sm font-medium text-gray-500">商品</th>
                                    <th class="px-4 py-4 text-left text-sm font-medium text-gray-500">分类</th>
                                    <th class="px-4 py-4 text-right text-sm font-medium text-gray-500">价格</th>
                                    <th class="px-4 py-4 text-left text-sm font-medium text-gray-500">库存</th>
                                    <th class="px-4 py-4 text-left text-sm font-medium text-gray-500">状态</th>
                                    <th class="px-4 py-4 text-left text-sm font-medium text-gray-500">排序</th>
                                    <th class="px-4 py-4 text-left text-sm font-medium text-gray-500">操作</th>
                                </tr>
                            </thead>
                            <tbody id="productTableBody" class="divide-y divide-gray-200">
                                <tr><td colspan="8" class="px-6 py-8 text-center text-gray-500">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="px-6 py-3 bg-gray-50 flex items-center justify-between text-sm">
                        <span id="pageInfo" class="text-gray-500"></span>
                        <div class="flex items-center gap-2">
                            <button onclick="changePage(-1)" id="prevBtn"
                                class="px-3 py-1 bg-white border border-gray-300 rounded hover:bg-gray-100 disabled:opacity-40">上一页</button>
                            <button onclick="changePage(1)" id="nextBtn"
                                class="px-3 py-1 bg-white border border-gray-300 rounded hover:bg-gray-100 disabled:opacity-40">下一页</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 新增/编辑表单 -->
    <div id="formModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-2xl max-h-screen overflow-y-auto">
            <h3 id="formTitle" class="text-xl font-bold text-gray-800 mb-1">新增商品</h3>
            <p class="text-xs text-gray-500 mb-4">带 * 为必填；价格按元填写，系统自动换算为分存储</p>

            <div id="formError" class="hidden mb-4 px-4 py-2 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm"></div>

            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-xs font-medium text-gray-600 mb-1">商品名称 *</label>
                    <input id="fName" maxlength="40" placeholder="2-40 个字"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">分类 *</label>
                    <select id="fCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">价格（元）*</label>
                    <input id="fPriceYuan" type="number" step="0.01" min="0.01" max="1000"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">库存 *</label>
                    <input id="fStock" type="number" min="0" max="999999" placeholder="0 表示售罄"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">单位 *</label>
                    <input id="fUnit" maxlength="4" placeholder="包 / 提 / 条"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">角标</label>
                    <input id="fTag" maxlength="6" placeholder="热销 / 推荐（可空）"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">排序</label>
                    <input id="fSort" type="number" min="0" max="9999" placeholder="越小越靠前"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">上架状态</label>
                    <select id="fStatus" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                        <option value="on">上架（商店可见）</option>
                        <option value="off">下架（商店隐藏）</option>
                    </select>
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-medium text-gray-600 mb-1">图片地址</label>
                    <input id="fImage" placeholder="https:// 或 cloud:// 开头（可空）"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" oninput="previewImage()">
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-medium text-gray-600 mb-1">商品描述</label>
                    <textarea id="fDesc" rows="2" maxlength="100" placeholder="最多 100 个字"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></textarea>
                </div>
                <div class="col-span-2 flex items-center gap-3">
                    <img id="imagePreview" class="hidden w-20 h-20 rounded-lg object-cover border border-gray-200" alt="预览">
                    <span id="imagePreviewTip" class="text-xs text-gray-400">填写图片地址后此处显示预览</span>
                </div>
            </div>

            <div class="flex gap-3 pt-6">
                <button onclick="closeForm()" class="flex-1 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 transition">取消</button>
                <button id="btnSave" onclick="submitForm()"
                    class="flex-1 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">保存</button>
            </div>
        </div>
    </div>

    <div id="toast" class="hidden px-5 py-3 rounded-xl shadow-lg text-sm font-medium"></div>

    <script>
    // 依赖 js/admin-api.js（页面内不再声明 API_BASE，避免全局重复声明）
    const { get, post, put, del, escapeHtml, renderError } = window.AdminAPI;

    const PAGE_SIZE = 10;
    const CATEGORY_FALLBACK = [
      { value: 'tissue', label: '抽纸' },
      { value: 'pocket', label: '手帕纸' },
      { value: 'wet', label: '湿巾' },
      { value: 'other', label: '其他' },
    ];

    let currentPage = 1;
    let totalItems = 0;
    let currentList = [];
    let selected = new Set();
    let editingId = null;
    let categories = CATEGORY_FALLBACK;
    let toastTimer = null;

    function fen2yuan(fen) {
      return (Number(fen || 0) / 100).toFixed(2);
    }

    function yuan2fen(yuan) {
      return Math.round(Number(yuan || 0) * 100);
    }

    function toast(message, type) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.className = 'px-5 py-3 rounded-xl shadow-lg text-sm font-medium '
        + (type === 'error' ? 'bg-red-600 text-white' : 'bg-green-600 text-white');
      el.classList.remove('hidden');
      el.style.opacity = '1';
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        el.style.opacity = '0';
        setTimeout(function () { el.classList.add('hidden'); }, 250);
      }, 2200);
    }

    function showFormError(msg) {
      const el = document.getElementById('formError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideFormError() {
      document.getElementById('formError').classList.add('hidden');
    }

    function buildQuery(page) {
      const params = new URLSearchParams();
      const keyword = document.getElementById('filterKeyword').value.trim();
      const category = document.getElementById('filterCategory').value;
      const status = document.getElementById('filterStatus').value;
      if (keyword) params.set('keyword', keyword);
      if (category) params.set('category', category);
      if (status) params.set('status', status);
      params.set('page', String(page || 1));
      params.set('pageSize', String(PAGE_SIZE));
      return params.toString();
    }

    async function loadProducts() {
      try {
        const res = await get('/api/admin/products?' + buildQuery(currentPage));
        if (!res || !res.success) throw new Error((res && res.message) || '加载失败');

        const data = res.data || {};
        currentList = data.list || [];
        totalItems = data.total || 0;

        if (Array.isArray(data.categories) && data.categories.length) {
          categories = data.categories;
          fillCategorySelects();
        }

        const stats = data.stats || {};
        document.getElementById('statAll').textContent = stats.all || 0;
        document.getElementById('statOn').textContent = stats.on || 0;
        document.getElementById('statOff').textContent = stats.off || 0;
        document.getElementById('statLow').textContent = stats.lowStock || 0;

        document.getElementById('btnSeed').classList.toggle('hidden', totalItems !== 0);

        renderList();
        renderPaging();
        updateBatchBar();
      } catch (err) {
        renderError('productTableBody', err, 8);
      }
    }

    function fillCategorySelects() {
      const filterSel = document.getElementById('filterCategory');
      const formSel = document.getElementById('fCategory');
      const keepFilter = filterSel.value;
      const keepForm = formSel.value;

      filterSel.innerHTML = '<option value="">全部分类</option>'
        + categories.map(function (c) { return '<option value="' + c.value + '">' + escapeHtml(c.label) + '</option>'; }).join('');
      formSel.innerHTML = categories
        .map(function (c) { return '<option value="' + c.value + '">' + escapeHtml(c.label) + '</option>'; }).join('');

      if (keepFilter) filterSel.value = keepFilter;
      if (keepForm) formSel.value = keepForm;
    }

    function stockCell(p) {
      const stock = Number(p.stock) || 0;
      if (stock === 0) return '<span class="badge badge-out">售罄</span>';
      if (stock <= 10) return '<span class="badge badge-low">' + stock + ' 件</span>';
      return '<span class="text-sm text-gray-700">' + stock + ' 件</span>';
    }

    function renderList() {
      const tbody = document.getElementById('productTableBody');
      if (currentList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-10 text-center text-gray-500">'
          + '暂无商品。点击右上角「新增商品」，或先「导入默认商品」快速初始化。</td></tr>';
        return;
      }

      tbody.innerHTML = currentList.map(function (p, i) {
        const img = p.image
          ? '<img src="' + escapeHtml(p.image) + '" class="thumb" alt="">'
          : '<div class="thumb flex items-center justify-center text-gray-300 text-xs">无图</div>';
        const tag = p.tag ? ' <span class="badge bg-amber-50 text-amber-700">' + escapeHtml(p.tag) + '</span>' : '';
        const statusBadge = p.status === 'on'
          ? '<span class="badge badge-on">上架中</span>'
          : '<span class="badge badge-off">已下架</span>';
        const nextLabel = p.status === 'on' ? '下架' : '上架';

        return '<tr class="hover:bg-gray-50">'
          + '<td class="pl-6 pr-2 py-3"><input type="checkbox" class="w-4 h-4 row-check" data-id="' + escapeHtml(p._id) + '"'
          + (selected.has(p._id) ? ' checked' : '') + ' onchange="toggleOne(this)"></td>'
          + '<td class="px-4 py-3"><div class="flex items-center gap-3">' + img
          + '<div><p class="text-sm font-medium text-gray-800">' + escapeHtml(p.name) + tag + '</p>'
          + '<p class="text-xs text-gray-400 max-w-xs truncate">' + escapeHtml(p.desc || '—') + '</p></div></div></td>'
          + '<td class="px-4 py-3 text-sm text-gray-600">' + escapeHtml(p.categoryText) + '</td>'
          + '<td class="px-4 py-3 text-right text-sm font-bold text-red-600">¥' + fen2yuan(p.price) + '</td>'
          + '<td class="px-4 py-3">' + stockCell(p) + '</td>'
          + '<td class="px-4 py-3">' + statusBadge + '</td>'
          + '<td class="px-4 py-3 text-sm text-gray-500">' + (p.sort || 0) + '</td>'
          + '<td class="px-4 py-3 whitespace-nowrap">'
          + '<button onclick="openForm(' + i + ')" class="text-green-600 hover:text-green-700 text-sm font-medium mr-3">编辑</button>'
          + '<button onclick="switchStatus(' + i + ')" class="text-blue-600 hover:text-blue-700 text-sm font-medium mr-3">' + nextLabel + '</button>'
          + '<button onclick="removeOne(' + i + ')" class="text-red-600 hover:text-red-700 text-sm font-medium">删除</button>'
          + '</td></tr>';
      }).join('');
    }

    function renderPaging() {
      const totalPages = Math.max(Math.ceil(totalItems / PAGE_SIZE), 1);
      document.getElementById('pageInfo').textContent =
        '共 ' + totalItems + ' 个商品 · 第 ' + currentPage + '/' + totalPages + ' 页';
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function applyFilter() {
      currentPage = 1;
      loadProducts();
    }

    function resetFilter() {
      document.getElementById('filterKeyword').value = '';
      document.getElementById('filterCategory').value = '';
      document.getElementById('filterStatus').value = '';
      currentPage = 1;
      loadProducts();
    }

    function filterByStatus(status) {
      document.getElementById('filterStatus').value = status;
      currentPage = 1;
      loadProducts();
    }

    function changePage(delta) {
      const totalPages = Math.max(Math.ceil(totalItems / PAGE_SIZE), 1);
      const next = currentPage + delta;
      if (next < 1 || next > totalPages) return;
      currentPage = next;
      loadProducts();
    }

    function toggleOne(box) {
      const id = box.getAttribute('data-id');
      if (box.checked) selected.add(id); else selected.delete(id);
      updateBatchBar();
    }

    function toggleAll(checked) {
      currentList.forEach(function (p) {
        if (checked) selected.add(p._id); else selected.delete(p._id);
      });
      document.querySelectorAll('.row-check').forEach(function (box) { box.checked = checked; });
      updateBatchBar();
    }

    function clearSelection() {
      selected.clear();
      document.querySelectorAll('.row-check').forEach(function (box) { box.checked = false; });
      document.getElementById('checkAll').checked = false;
      updateBatchBar();
    }

    function updateBatchBar() {
      document.getElementById('selectedCount').textContent = String(selected.size);
      document.getElementById('batchBar').classList.toggle('hidden', selected.size === 0);
      const allChecked = currentList.length > 0 && currentList.every(function (p) { return selected.has(p._id); });
      document.getElementById('checkAll').checked = allChecked;
    }

    async function batchDelete() {
      const ids = Array.from(selected);
      if (ids.length === 0) return;
      if (!confirm('确定删除选中的 ' + ids.length + ' 个商品吗？删除后不可恢复（历史订单已保存商品快照，不受影响）。')) return;

      try {
        const res = await post('/api/admin/products/batch-delete', { ids: ids });
        if (!res || !res.success) { toast((res && res.message) || '批量删除失败', 'error'); return; }
        toast(res.message || '已删除');
        clearSelection();
        loadProducts();
      } catch (err) {
        toast((err && err.message) || '批量删除失败', 'error');
      }
    }

    async function switchStatus(index) {
      const p = currentList[index];
      if (!p) return;
      const target = p.status === 'on' ? 'off' : 'on';
      try {
        const res = await post('/api/admin/products/' + p._id + '/status', { status: target });
        if (!res || !res.success) { toast((res && res.message) || '操作失败', 'error'); return; }
        toast(res.message || '操作成功');
        loadProducts();
      } catch (err) {
        toast((err && err.message) || '操作失败', 'error');
      }
    }

    async function removeOne(index) {
      const p = currentList[index];
      if (!p) return;
      if (!confirm('确定删除「' + p.name + '」吗？删除后不可恢复（历史订单已保存商品快照，不受影响）。')) return;

      try {
        const res = await del('/api/admin/products/' + p._id);
        if (!res || !res.success) { toast((res && res.message) || '删除失败', 'error'); return; }
        toast(res.message || '商品已删除');
        selected.delete(p._id);
        if (currentList.length === 1 && currentPage > 1) currentPage -= 1;
        loadProducts();
      } catch (err) {
        toast((err && err.message) || '删除失败', 'error');
      }
    }

    async function seedProducts() {
      if (!confirm('导入 4 个默认商品（本色抽纸系列）？仅商品库为空时可导入。')) return;
      try {
        const res = await post('/api/admin/products/seed', {});
        if (!res || !res.success) { toast((res && res.message) || '导入失败', 'error'); return; }
        toast(res.message || '导入成功');
        applyFilter();
      } catch (err) {
        toast((err && err.message) || '导入失败', 'error');
      }
    }

    function openForm(index) {
      hideFormError();
      const p = typeof index === 'number' ? currentList[index] : null;
      editingId = p ? p._id : null;

      document.getElementById('formTitle').textContent = p ? '编辑商品' : '新增商品';
      document.getElementById('fName').value = p ? p.name : '';
      document.getElementById('fCategory').value = p ? p.category : (categories[0] ? categories[0].value : 'tissue');
      document.getElementById('fPriceYuan').value = p ? fen2yuan(p.price) : '';
      document.getElementById('fStock').value = p && p.stock !== undefined ? p.stock : '';
      document.getElementById('fUnit').value = p ? (p.unit || '') : '';
      document.getElementById('fTag').value = p ? (p.tag || '') : '';
      document.getElementById('fSort').value = p ? (p.sort || 0) : 0;
      document.getElementById('fStatus').value = p ? (p.status || 'on') : 'on';
      document.getElementById('fImage').value = p ? (p.image || '') : '';
      document.getElementById('fDesc').value = p ? (p.desc || '') : '';

      previewImage();

      const modal = document.getElementById('formModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeForm() {
      const modal = document.getElementById('formModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      editingId = null;
    }

    function previewImage() {
      const url = document.getElementById('fImage').value.trim();
      const img = document.getElementById('imagePreview');
      const tip = document.getElementById('imagePreviewTip');

      if (!url) {
        img.classList.add('hidden');
        tip.classList.remove('hidden');
        tip.textContent = '填写图片地址后此处显示预览';
        return;
      }
      img.src = url;
      img.classList.remove('hidden');
      tip.classList.add('hidden');
      img.onerror = function () {
        img.classList.add('hidden');
        tip.classList.remove('hidden');
        tip.textContent = '图片加载失败，请检查地址';
      };
    }

    /** 前端校验：与服务端规则一致，仅作即时提示，最终以服务端返回为准 */
    function validateForm() {
      const name = document.getElementById('fName').value.trim();
      if (name.length < 2) return '商品名称至少 2 个字';
      if (name.length > 40) return '商品名称最多 40 个字';

      const priceYuan = document.getElementById('fPriceYuan').value;
      const price = yuan2fen(priceYuan);
      if (!priceYuan || !Number.isInteger(price) || price < 1 || price > 100000) {
        return '价格需为 0.01-1000 元';
      }

      const stockStr = document.getElementById('fStock').value;
      const stock = Number(stockStr);
      if (stockStr === '' || !Number.isInteger(stock) || stock < 0 || stock > 999999) {
        return '库存需为 0-999999 的整数';
      }

      const unit = document.getElementById('fUnit').value.trim();
      if (!unit || unit.length > 4) return '单位必填，最多 4 个字';

      const desc = document.getElementById('fDesc').value.trim();
      if (desc.length > 100) return '商品描述最多 100 个字';

      const tag = document.getElementById('fTag').value.trim();
      if (tag.length > 6) return '角标最多 6 个字';

      const image = document.getElementById('fImage').value.trim();
      if (image && image.indexOf('https://') !== 0 && image.indexOf('cloud://') !== 0) {
        return '图片需为 https:// 或 cloud:// 开头的地址';
      }

      const sort = Number(document.getElementById('fSort').value || 0);
      if (!Number.isInteger(sort) || sort < 0 || sort > 9999) return '排序需为 0-9999 的整数';

      return '';
    }

    async function submitForm() {
      hideFormError();
      const err = validateForm();
      if (err) { showFormError(err); return; }

      const payload = {
        name: document.getElementById('fName').value.trim(),
        category: document.getElementById('fCategory').value,
        price: yuan2fen(document.getElementById('fPriceYuan').value),
        stock: Number(document.getElementById('fStock').value),
        unit: document.getElementById('fUnit').value.trim(),
        tag: document.getElementById('fTag').value.trim(),
        sort: Number(document.getElementById('fSort').value || 0),
        status: document.getElementById('fStatus').value,
        image: document.getElementById('fImage').value.trim(),
        desc: document.getElementById('fDesc').value.trim(),
      };

      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.textContent = '保存中...';

      try {
        const res = editingId
          ? await put('/api/admin/products/' + editingId, payload)
          : await post('/api/admin/products', payload);

        if (!res || !res.success) { showFormError((res && res.message) || '保存失败'); return; }

        toast(res.message || '保存成功');
        closeForm();
        loadProducts();
      } catch (e) {
        showFormError((e && e.message) || '保存失败');
      } finally {
        btn.disabled = false;
        btn.textContent = '保存';
      }
    }

    const adminName = sessionStorage.getItem('adminUsername');
    if (adminName) document.getElementById('adminName').textContent = adminName;

    fillCategorySelects();
    loadProducts();
    </script>
</body>
</html>
